<div id="tvxRemote" class="tvx-remote type2" style="display:none;">    
    <div class="tvx-button left" tvx:action="left"><i class="tvx-icon tvx-icon-keyboard-arrow-left"></i></div>
    <div class="tvx-button right" tvx:action="right"><i class="tvx-icon tvx-icon-keyboard-arrow-right"></i></div>   
    <div class="tvx-button up" tvx:action="up"><i class="tvx-icon tvx-icon-keyboard-arrow-up"></i></div>
    <div class="tvx-button down" tvx:action="down"><i class="tvx-icon tvx-icon-keyboard-arrow-down"></i></div>
    <div class="tvx-button execute" tvx:action="execute"><i class="tvx-icon tvx-icon-done"></i></div>
    <div class="tvx-button back" tvx:action="back"><i class="tvx-icon tvx-icon-arrow-back"></i></div>
    <div class="tvx-button menu" tvx:action="menu"><i class="tvx-icon tvx-icon-menu"></i></div>  
    <div class="tvx-button eject" tvx:action="stop"><i class="tvx-icon tvx-icon-eject"></i></div>  
</div>
