<div id="tvxRemote" class="tvx-remote type4" style="display:none;">
    <div class="tvx-subcontrol tvx-subcontrol-right" style="display:none;">
        <div class="tvx-button info" tvx:action="input:info"><i class="tvx-icon tvx-icon-info"></i></div> 
        <div class="tvx-button guide" tvx:action="input:guide"><i class="tvx-icon tvx-icon-today"></i></div>       
        <div class="tvx-button channel-list" tvx:action="input:channel-list"><i class="tvx-icon tvx-icon-list"></i></div>
        <div class="tvx-button exit" tvx:action="input:exit"><i class="tvx-icon tvx-icon-power-settings-new"></i></div>
        <div class="tvx-button settings" tvx:action="input:settings"><i class="tvx-icon tvx-icon-settings"></i></div>       
        <div class="tvx-button left" tvx:action="input:left"><i class="tvx-icon tvx-icon-keyboard-arrow-left"></i></div>
        <div class="tvx-button right" tvx:action="input:right"><i class="tvx-icon tvx-icon-keyboard-arrow-right"></i></div>   
        <div class="tvx-button up" tvx:action="input:up"><i class="tvx-icon tvx-icon-keyboard-arrow-up"></i></div>
        <div class="tvx-button down" tvx:action="input:down"><i class="tvx-icon tvx-icon-keyboard-arrow-down"></i></div>
        <div class="tvx-button execute" tvx:action="input:execute"><i class="tvx-icon tvx-icon-done"></i></div>      
        <div class="tvx-button red" tvx:action="input:red"><i class="tvx-icon tvx-icon-stop tvx-color-red"></i></div>
        <div class="tvx-button green" tvx:action="input:green"><i class="tvx-icon tvx-icon-stop tvx-color-green"></i></div>
        <div class="tvx-button yellow" tvx:action="input:yellow"><i class="tvx-icon tvx-icon-stop tvx-color-yellow"></i></div>
        <div class="tvx-button blue" tvx:action="input:blue"><i class="tvx-icon tvx-icon-stop tvx-color-blue"></i></div>
        <div class="tvx-button channel-up" tvx:action="input:channel-up"><i class="tvx-icon tvx-icon-arrow-upward"></i></div>
        <div class="tvx-button channel-down" tvx:action="input:channel-down"><i class="tvx-icon tvx-icon-arrow-downward"></i></div>   
    </div>
    <div class="tvx-subcontrol tvx-subcontrol-left" style="display:none;">
        <div class="tvx-button key-1" tvx:action="input:key-1"><b class="tvx-icon-text">1</b></div>
        <div class="tvx-button key-2" tvx:action="input:key-2"><b class="tvx-icon-text">2</b></div>
        <div class="tvx-button key-3" tvx:action="input:key-3"><b class="tvx-icon-text">3</b></div>
        <div class="tvx-button key-4" tvx:action="input:key-4"><b class="tvx-icon-text">4</b></div>
        <div class="tvx-button key-5" tvx:action="input:key-5"><b class="tvx-icon-text">5</b></div>
        <div class="tvx-button key-6" tvx:action="input:key-6"><b class="tvx-icon-text">6</b></div>
        <div class="tvx-button key-7" tvx:action="input:key-7"><b class="tvx-icon-text">7</b></div>
        <div class="tvx-button key-8" tvx:action="input:key-8"><b class="tvx-icon-text">8</b></div> 
        <div class="tvx-button key-9" tvx:action="input:key-9"><b class="tvx-icon-text">9</b></div>
        <div class="tvx-button key-0" tvx:action="input:key-0"><b class="tvx-icon-text">0</b></div>
        <div class="tvx-button toggle-mute" tvx:action="input:toggle-mute"><i class="tvx-icon tvx-icon-volume-up"></i></div>
        <div class="tvx-button volume-up" tvx:action="input:volume-up"><i class="tvx-icon tvx-icon-add"></i></div>
        <div class="tvx-button volume-down" tvx:action="input:volume-down"><i class="tvx-icon tvx-icon-remove"></i></div>          
        <div class="tvx-button forward" tvx:action="input:forward"><i class="tvx-icon tvx-icon-fast-forward"></i></div>
        <div class="tvx-button rewind" tvx:action="input:rewind"><i class="tvx-icon tvx-icon-fast-rewind"></i></div>  
        <div class="tvx-button next-track" tvx:action="input:next-track"><i class="tvx-icon tvx-icon-skip-next"></i></div>
        <div class="tvx-button previous-track" tvx:action="input:previous-track"><i class="tvx-icon tvx-icon-skip-previous"></i></div>   
        <div class="tvx-button play" tvx:action="input:play"><i class="tvx-icon tvx-icon-play-arrow"></i></div> 
        <div class="tvx-button pause" tvx:action="input:pause"><i class="tvx-icon tvx-icon-pause"></i></div>       
        <div class="tvx-button record" tvx:action="input:record"><i class="tvx-icon tvx-icon-fiber-manual-record"></i></div>
    </div>
    <div class="tvx-button player" tvx:action="execute:player"><i class="tvx-icon tvx-icon-movie"></i></div>
    <div class="tvx-button eject" tvx:action="stop"><i class="tvx-icon tvx-icon-eject"></i></div>    
    <div class="tvx-button back" tvx:action="back"><i class="tvx-icon tvx-icon-arrow-back"></i></div>  
    <div class="tvx-button menu" tvx:action="menu"><i class="tvx-icon tvx-icon-menu"></i></div>    
    <div class="tvx-button toggle-right" tvx:action="toggle:right"><i class="tvx-icon tvx-icon-more-vert"></i></div>
    <div class="tvx-button toggle-left" tvx:action="toggle:left"><i class="tvx-icon tvx-icon-dialpad"></i></div>
</div>
