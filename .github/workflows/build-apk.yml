name: Build MSX MPV Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7 ile APK derle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          arguments: assembleDebug assembleRelease

      - name: Debug APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: msx-mpv-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: msx-mpv-release-apk
          path: app/build/outputs/apk/release/*.apk
