name: Build MSX MPV Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK lisanslarini kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle assembleDebug assembleRelease

      - name: Debug APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: msx-mpv-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: msx-mpv-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: GitHub Release olarak yayinla (kolay indirme icin)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --title "MSX MPV Player - build #${{ github.run_number }}" \
            --notes "Otomatik derleme. Commit: ${{ github.sha }}"
