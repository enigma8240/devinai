# Media Station X - Gömülü MPV Yapılandırması
vo=gpu
hwdec=auto-safe
ao=audiotrack
profile=fast
cache=yes
demuxer-max-bytes=134217728
demuxer-max-back-bytes=33554432
demuxer-readahead-secs=30
network-timeout=20
tls-verify=no
sub-auto=fuzzy
sub-font-size=44
sub-pos=94
sub-bold=yes
sub-border-size=2.5
sub-color="#FFFFFFFF"
sub-border-color="#CC000000"
alang=tur,tr,eng,en
slang=tur,tr,eng,en
save-position-on-quit=no
audio-spdif=ac3,eac3,dts,dts-hd,truehd
